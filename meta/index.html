<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <!-- Lab 6 Step 1.1 -->
    <script type="module" src="main.js"></script>
</head>
<body>
    <!-- Lab 6 Step 0.1 -->
    <h1>Meta</h1>
    <p>
        Stats about the code of this website, computed from its git history
        (one row per line of code in <code>loc.csv</code>, generated by elocuent).
    </p>

    <!-- Lab 6 Step 1.3: summary stats -->
    <h2>Summary</h2>
    <div id="stats"></div>

    <!-- Lab 6 Step 2.1: scatterplot -->
    <h2>Commits by time of day</h2>
    <div id="chart"></div>

    <!-- Lab 6 Step 5.5 + 5.6: brush selection details -->
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>

    <!-- Lab 6 Step 3.1 + 3.3: tooltip, hidden until a dot is hovered -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
